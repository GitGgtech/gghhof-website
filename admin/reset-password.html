<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GGHHOF | Reset Password</title>
<link rel="stylesheet" href="../styles.css">
<style>
.reset-wrap{max-width:480px;margin:60px auto;padding:20px}
.reset-card{background:#fff;border:1px solid #e4e9e6;border-radius:16px;padding:26px;box-shadow:0 8px 28px #102a430c}
.reset-card label{display:block;font-weight:650;margin-top:14px}
.reset-card input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cbd5d1;border-radius:9px;margin-top:6px}
.reset-card button{margin-top:18px}
#message{padding:12px;border-radius:8px;background:#eef6f3;margin-top:14px;color:#174c43}
#message.error{background:#fff0ed;color:#8a2c16}
</style>
</head>
<body>
<header class="site-header">
<a class="brand" href="../index.html"><img src="../assets/foundation-logo.jpg" alt="GGHHOF logo"><span><b>GREAT GOD</b><small>HELPING HANDS OUTREACH FOUNDATION</small></span></a>
</header>
<main class="reset-wrap">
<section class="reset-card">
<h1>Reset your password</h1>
<p>Use this page to create a new password for your Foundation administrator account.</p>
<div id="message" role="status" aria-live="polite">Verifying your recovery link…</div>
<form id="resetForm">
<label for="newPassword">New password</label>
<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required disabled>
<label for="confirmPassword">Confirm new password</label>
<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required disabled>
<button id="saveButton" class="button" type="submit" disabled>Save new password</button>
</form>
<p><a href="./index.html">Return to administrator sign in</a></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
(async()=>{
  const message=document.getElementById('message');
  const form=document.getElementById('resetForm');
  const saveButton=document.getElementById('saveButton');
  const passwordInput=document.getElementById('newPassword');
  const confirmInput=document.getElementById('confirmPassword');
  let recoveryVerified=false;
  function showMessage(text,isError=false){message.textContent=text;message.classList.toggle('error',isError);}
  function enableForm(){recoveryVerified=true;passwordInput.disabled=false;confirmInput.disabled=false;saveButton.disabled=false;showMessage('Recovery link verified. Enter your new password below.');}
  if(!window.GGHHOF_SUPABASE?.url||!window.GGHHOF_SUPABASE?.anonKey||!window.supabase){showMessage('Supabase configuration is missing. Please contact the site administrator.',true);return;}
  const db=window.supabase.createClient(window.GGHHOF_SUPABASE.url,window.GGHHOF_SUPABASE.anonKey);
  // Supabase emits PASSWORD_RECOVERY after validating the recovery link and establishing its session.
  db.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'&&session)enableForm();
  });
  // Give Supabase time to process the callback URL. Do not accept an ordinary login session as proof of recovery.
  const params=new URLSearchParams(window.location.search);
  const hashParams=new URLSearchParams(window.location.hash.replace(/^#/,'').replace(/^\?/,'&'));
  const callbackError=params.get('error_description')||hashParams.get('error_description')||params.get('error')||hashParams.get('error');
  if(callbackError){showMessage('This recovery link is invalid or expired. Return to sign in and request a new password reset email.',true);return;}
  window.setTimeout(()=>{if(!recoveryVerified)showMessage('The recovery link could not be verified. It may have expired or already been used. Return to sign in and request a new one.',true);},8000);
  form.addEventListener('submit',async(event)=>{
    event.preventDefault();
    if(!recoveryVerified){showMessage('Open the password recovery link from your email before changing your password.',true);return;}
    const password=passwordInput.value;
    if(password.length<8){showMessage('Your password must contain at least 8 characters.',true);return;}
    if(password!==confirmInput.value){showMessage('The passwords do not match.',true);return;}
    saveButton.disabled=true;showMessage('Updating your password…');
    const {error}=await db.auth.updateUser({password});
    if(error){saveButton.disabled=false;showMessage('Password update failed: '+error.message,true);return;}
    await db.auth.signOut();
    form.reset();passwordInput.disabled=true;confirmInput.disabled=true;
    showMessage('Your password has been changed successfully. Return to administrator sign in and use your new password.');
  });
})();
</script>
</body>
</html>
